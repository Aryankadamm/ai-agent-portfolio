services:
  - type: web
    name: clinicflow-ai-demo
    runtime: docker
    plan: free
    dockerContext: ./projects/clinicflow-ai
    dockerfilePath: ./projects/clinicflow-ai/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CLINIC_NAME
        value: Northstar Family Clinic
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
